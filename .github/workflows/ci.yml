name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_tracker
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_user -d gym_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify frontend
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/workout-tools.js
          node --check src/main/resources/static/progress.js
          node --check src/main/resources/static/account.js
          node --check src/main/resources/static/auth.js
          node --check src/main/resources/static/reset-password.js
          node --test src/test/frontend/*.test.cjs

      - name: Build deployment image
        run: docker build --tag gym-tracker:ci .

      - name: Smoke test Render deployment profile
        run: |
          trap 'docker logs gym-tracker-render-smoke; docker rm -f gym-tracker-render-smoke' EXIT
          docker run --detach --name gym-tracker-render-smoke --network host \
            -e SPRING_PROFILES_ACTIVE=render -e PORT=18080 \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=gym_tracker \
            -e DB_USERNAME=gym_user -e DB_PASSWORD=gym_password \
            gym-tracker:ci
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 2 --retry-max-time 90 --max-time 5 \
            http://127.0.0.1:18080/api/health
