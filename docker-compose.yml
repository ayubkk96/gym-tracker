services:
  postgres:
    image: postgres:17-alpine
    container_name: gym-tracker-postgres
    environment:
      POSTGRES_DB: gym_tracker
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - gym_tracker_data:/var/lib/postgresql/data

volumes:
  gym_tracker_data: