# Activated only by SPRING_PROFILES_ACTIVE=render; local development is unchanged.
server.address=0.0.0.0
server.port=${PORT:10000}
server.servlet.session.cookie.secure=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Spring interpolates the individual database properties, not Render's YAML.
# Render's postgresql:// connection string is NOT a JDBC URL.
# Required values deliberately have no localhost/development-credential fallback.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.show-sql=false
