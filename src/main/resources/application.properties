spring.application.name=gym-tracker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gym_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gym_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gym_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.forward-headers-strategy=framework
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never

tracker.bootstrap-email=${TRACKER_BOOTSTRAP_EMAIL:}
tracker.bootstrap-password=${TRACKER_BOOTSTRAP_PASSWORD:}

# Enable only after SMTP and the public HTTPS origin have been configured.
tracker.recovery.enabled=${PASSWORD_RESET_ENABLED:false}
tracker.recovery.public-url=${APP_PUBLIC_URL:}
tracker.recovery.from=${MAIL_FROM:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
