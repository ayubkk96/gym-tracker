spring.application.name=gym-tracker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gym_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gym_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gym_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.forward-headers-strategy=framework
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never

tracker.bootstrap-email=${TRACKER_BOOTSTRAP_EMAIL:}
tracker.bootstrap-password=${TRACKER_BOOTSTRAP_PASSWORD:}
