<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password · Gym Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="reset-password.js" defer></script>
</head>
<body class="auth-page">
<main class="recovery-shell">
    <a class="brand" href="login.html"><span class="brand-mark" aria-hidden="true">GT</span> Gym Tracker</a>
    <section class="auth-panel" aria-labelledby="recovery-title">
        <p class="eyebrow">Account recovery</p>
        <h1 id="recovery-title">Reset your password</h1>
        <p id="recovery-description">Enter your account email to request a reset link.</p>
        <p id="recovery-status" class="status" role="status" aria-live="polite"></p>
        <noscript>Please enable JavaScript to reset your password.</noscript>
        <form id="recovery-request-form" class="auth-form">
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" maxlength="255" required></label>
            <button type="submit" disabled>Send reset link</button>
        </form>
        <form id="recovery-confirm-form" class="auth-form" hidden>
            <label class="field"><span>New password</span><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="64" required></label>
            <label class="field"><span>Confirm new password</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="64" required></label>
            <p class="form-hint">Use 12–64 characters. Resetting signs you out on all devices.</p>
            <button type="submit" disabled>Update password</button>
        </form>
        <p class="recovery-links"><a href="login.html">Back to sign in</a> · <a href="reset-password.html">Request a new link</a></p>
    </section>
</main>
</body>
</html>
