<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gym & Nutrition Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
<header class="header">
    <div>
        <p class="eyebrow">Your fitness journey</p>
        <h1>Gym Tracker</h1>
    </div>

    <div class="date-control">
        <label for="dashboard-date">Date</label>

        <div class="date-row">
            <input id="dashboard-date" type="date">
            <button id="load-dashboard" type="button">
                Load
            </button>
        </div>
    </div>
</header>

<main>
    <p id="status-message" class="status"></p>

    <section>
        <div class="section-heading">
            <div>
                <p class="eyebrow">Daily performance</p>
                <h2 id="day-title">Dashboard</h2>
            </div>

            <div class="section-actions">
    <span id="weight-value" class="weight">
        Weight: —
    </span>
                <button
                        id="open-nutrition-form"
                        class="secondary-button"
                        type="button">
                    Log Nutrition
                </button>
            </div>
        </div>

        <div class="macro-grid">
            <article class="macro-card">
                <span>Calories</span>
                <strong id="calories-value">—</strong>
                <progress id="calories-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Protein</span>
                <strong id="protein-value">—</strong>
                <progress id="protein-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Carbs</span>
                <strong id="carbs-value">—</strong>
                <progress id="carbs-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Fat</span>
                <strong id="fat-value">—</strong>
                <progress id="fat-progress"></progress>
            </article>
        </div>

        <p id="nutrition-notes" class="notes"></p>
    </section>

    <section>
        <div class="section-heading">
            <div>
                <p class="eyebrow">Training log</p>
                <h2>Workout</h2>
            </div>
        </div>

        <div id="workout-container"></div>
    </section>
    <dialog id="nutrition-dialog">
        <form id="nutrition-form">
            <div class="dialog-heading">
                <div>
                    <p class="eyebrow">Daily intake</p>
                    <h2>Log Nutrition</h2>
                </div>

                <button
                        id="close-nutrition-form"
                        class="icon-button"
                        type="button"
                        aria-label="Close">
                    ×
                </button>
            </div>

            <div class="form-grid">
                <label class="field full-width">
                    <span>Date</span>
                    <input
                            name="date"
                            type="date"
                            required>
                </label>

                <label class="field">
                    <span>Calories</span>
                    <input
                            name="calories"
                            type="number"
                            min="1"
                            required>
                </label>

                <label class="field">
                    <span>Protein (g)</span>
                    <input
                            name="proteinG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field">
                    <span>Carbs (g)</span>
                    <input
                            name="carbsG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field">
                    <span>Fat (g)</span>
                    <input
                            name="fatG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field full-width">
                    <span>Morning weight (kg)</span>
                    <input
                            name="weightKg"
                            type="number"
                            min="1"
                            step="0.1">
                </label>

                <label class="field full-width">
                    <span>Notes</span>
                    <textarea
                            name="notes"
                            rows="3"
                            maxlength="250"></textarea>
                </label>
            </div>

            <p
                    id="nutrition-form-status"
                    class="status"
                    aria-live="polite">
            </p>

            <div class="dialog-actions">
                <button
                        id="cancel-nutrition-form"
                        class="secondary-button"
                        type="button">
                    Cancel
                </button>

                <button
                        id="save-nutrition"
                        type="submit">
                    Save Nutrition
                </button>
            </div>
        </form>
    </dialog>
</main>
</body>
</html>
