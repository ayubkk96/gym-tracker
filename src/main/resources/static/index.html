<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gym & Nutrition Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
<header class="header">
    <div>
        <p class="eyebrow">Your fitness journey</p>
        <h1>Gym Tracker</h1>
    </div>

    <div class="date-control">
        <label for="dashboard-date">Date</label>

        <div class="date-row">
            <input id="dashboard-date" type="date">
            <button id="load-dashboard" type="button">
                Load
            </button>
        </div>
    </div>
</header>

<main>
    <p id="status-message" class="status"></p>

    <section>
        <div class="section-heading">
            <div>
                <p class="eyebrow">Daily performance</p>
                <h2 id="day-title">Dashboard</h2>
            </div>

            <div class="section-actions">
    <span id="weight-value" class="weight">
        Weight: —
    </span>
                <button
                        id="open-nutrition-form"
                        class="secondary-button"
                        type="button">
                    Log Nutrition
                </button>
            </div>
        </div>

        <div class="macro-grid">
            <article class="macro-card">
                <span>Calories</span>
                <strong id="calories-value">—</strong>
                <progress id="calories-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Protein</span>
                <strong id="protein-value">—</strong>
                <progress id="protein-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Carbs</span>
                <strong id="carbs-value">—</strong>
                <progress id="carbs-progress"></progress>
            </article>

            <article class="macro-card">
                <span>Fat</span>
                <strong id="fat-value">—</strong>
                <progress id="fat-progress"></progress>
            </article>
        </div>

        <p id="nutrition-notes" class="notes"></p>
    </section>

    <section>
        <div class="section-heading">
            <div>
                <p class="eyebrow">Training log</p>
                <h2>Workout</h2>
            </div>

            <button
                    id="open-workout-form"
                    class="secondary-button"
                    type="button">
                Log Workout
            </button>
        </div>

        <div id="workout-container"></div>
    </section>

    <dialog id="nutrition-dialog">
        <form id="nutrition-form">
            <div class="dialog-heading">
                <div>
                    <p class="eyebrow">Daily intake</p>
                    <h2>Log Nutrition</h2>
                </div>

                <button
                        id="close-nutrition-form"
                        class="icon-button"
                        type="button"
                        aria-label="Close">
                    ×
                </button>
            </div>

            <div class="form-grid">
                <label class="field full-width">
                    <span>Date</span>
                    <input
                            name="date"
                            type="date"
                            required>
                </label>

                <label class="field">
                    <span>Calories</span>
                    <input
                            name="calories"
                            type="number"
                            min="1"
                            required>
                </label>

                <label class="field">
                    <span>Protein (g)</span>
                    <input
                            name="proteinG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field">
                    <span>Carbs (g)</span>
                    <input
                            name="carbsG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field">
                    <span>Fat (g)</span>
                    <input
                            name="fatG"
                            type="number"
                            min="0"
                            required>
                </label>

                <label class="field full-width">
                    <span>Morning weight (kg)</span>
                    <input
                            name="weightKg"
                            type="number"
                            min="1"
                            step="0.1">
                </label>

                <label class="field full-width">
                    <span>Notes</span>
                    <textarea
                            name="notes"
                            rows="3"
                            maxlength="250"></textarea>
                </label>
            </div>

            <p
                    id="nutrition-form-status"
                    class="status"
                    aria-live="polite">
            </p>

            <div class="dialog-actions">
                <button
                        id="cancel-nutrition-form"
                        class="secondary-button"
                        type="button">
                    Cancel
                </button>

                <button
                        id="save-nutrition"
                        type="submit">
                    Save Nutrition
                </button>
            </div>
        </form>
    </dialog>

    <dialog id="workout-dialog" class="workout-form-dialog">
        <form id="workout-form">
            <div class="dialog-heading">
                <div>
                    <p class="eyebrow">Training session</p>
                    <h2 id="workout-form-title">Log Workout</h2>
                </div>

                <button
                        id="close-workout-form"
                        class="icon-button"
                        type="button"
                        aria-label="Close">
                    ×
                </button>
            </div>

            <div class="form-grid">
                <label class="field">
                    <span>Date</span>
                    <input name="date" type="date" required>
                </label>

                <label class="field">
                    <span>Workout name</span>
                    <input
                            name="workout"
                            type="text"
                            maxlength="100"
                            placeholder="Chest + Triceps"
                            required>
                </label>

                <label class="field full-width">
                    <span>Workout notes</span>
                    <textarea
                            name="notes"
                            rows="2"
                            maxlength="500"></textarea>
                </label>

                <label class="rest-option full-width">
                    <input id="rest-workout" type="checkbox">
                    <span>This was a rest day</span>
                </label>
            </div>

            <div id="exercise-editor-section">
                <div class="editor-section-heading">
                    <h3>Exercises</h3>
                    <button
                            id="add-exercise"
                            class="secondary-button compact-button"
                            type="button">
                        Add Exercise
                    </button>
                </div>

                <div id="exercise-editors"></div>
            </div>

            <p
                    id="workout-form-status"
                    class="status"
                    aria-live="polite">
            </p>

            <div class="dialog-actions">
                <button
                        id="cancel-workout-form"
                        class="secondary-button"
                        type="button">
                    Cancel
                </button>

                <button id="save-workout" type="submit">
                    Save Workout
                </button>
            </div>
        </form>
    </dialog>

    <template id="exercise-editor-template">
        <fieldset class="exercise-editor">
            <div class="exercise-editor-heading">
                <strong class="exercise-editor-number">Exercise</strong>
                <button
                        class="remove-exercise icon-button"
                        type="button"
                        aria-label="Remove exercise">
                    ×
                </button>
            </div>

            <label class="field">
                <span>Exercise name</span>
                <input
                        class="exercise-name"
                        type="text"
                        maxlength="100"
                        placeholder="Bench Press"
                        required>
            </label>

            <div class="sets-heading">
                <span>Sets</span>
                <button
                        class="add-set secondary-button compact-button"
                        type="button">
                    Add Set
                </button>
            </div>

            <div class="set-editors"></div>

            <label class="field">
                <span>Exercise notes</span>
                <textarea
                        class="exercise-notes"
                        rows="2"
                        maxlength="500"></textarea>
            </label>
        </fieldset>
    </template>

    <template id="set-editor-template">
        <div class="set-editor">
            <strong class="set-editor-number">Set</strong>

            <label class="field">
                <span>Weight (kg)</span>
                <input
                        class="set-weight"
                        type="number"
                        min="0"
                        step="0.1"
                        placeholder="Empty = BW">
            </label>

            <label class="field">
                <span>Reps</span>
                <input
                        class="set-reps"
                        type="number"
                        min="1"
                        required>
            </label>

            <button
                    class="remove-set icon-button"
                    type="button"
                    aria-label="Remove set">
                ×
            </button>
        </div>
    </template>
</main>
</body>
</html>
